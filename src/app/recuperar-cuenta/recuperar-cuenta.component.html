<app-cyber-layout>

  <form class="cyber-form">

    <!-- Encabezado -->
    <h2 class="cyber-title">RECUPERAR ACCESO</h2>
    <p class="cyber-text">
      Ingresa tu dirección de correo electrónico asociada. Te enviaremos un enlace encriptado para restaurar tu contraseña.
    </p>

    <!-- Campo de Entrada -->
    <div class="cyber-input-group">
      <label for="recovery-email">Correo Electrónico</label>
      <input type="email" id="recovery-email" placeholder="draco@dragoncode.com" required>
    </div>

    <!-- Fila de acciones: Volver + Enviar Enlace -->
    <div class="cyber-btn-row">
      <a routerLink="/login" class="cyber-btn">VOLVER</a>
      <button type="submit" class="cyber-btn">ENVIAR ENLACE</button>
    </div>

  </form>

</app-cyber-layout>
