<!-- El contenedor maestro con el fondo de la cueva -->
<main class="login-layout">
  
  <!-- La Capa Programática de Runas (Ahora sí encapsulada correctamente) -->
  <div class="runes-layer">
    @for (rune of runes; track $index) {
      <span class="rune"
            [style.top]="rune.top"
            [style.left]="rune.left"
            [style.color]="rune.color"
            [style.animation-delay]="rune.delay"
            [style.animation-duration]="rune.duration"
            [style.font-size]="rune.fontSize">
        {{ rune.symbol }}
      </span>
    }
  </div>

  <!-- La columna central flexible -->
  <section class="content-column">
    
    <!-- Avatar dinámico -->
    <div class="avatar-container">
      <img [src]="currentAvatar" alt="Avatar de Draco" class="draco-avatar">
    </div>

    <!-- Título del juego -->
    <div class="title-container">
      <img src="assets/images/login/titulo.png" alt="Dragon Code" class="game-title">
    </div>

    <!-- ... -->
      <div class="form-container">
        
        <form class="login-form">
          <!-- Título -->
          <h2 class="form-title">INICIAR SESIÓN</h2>

          <!-- Grupo: Email -->
          <div class="input-group">
            <label for="email">Email</label>
            <input type="email" id="email" autocomplete="off" spellcheck="false">
          </div>

          <!-- Grupo: Contraseña -->
          <div class="input-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password">
          </div>

          <!-- Enlaces de acción inferiores -->
          <div class="form-actions">
            <a href="#" class="retro-link">Crear Cuenta</a>
            <a href="#" class="retro-link">Recuperar Cuenta</a>
          </div>
        </form>

      </div>

  </section>

</main>
