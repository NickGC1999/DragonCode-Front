<!-- El contenedor maestro con el fondo de la cueva -->
<div class="login-layout">
  
  <!-- La Capa Programática de Runas (Fondo aislado) -->
  <div class="runes-layer">
    @for (rune of runes; track $index) {
      <span class="rune"
            [style.top]="rune.top"
            [style.left]="rune.left"
            [style.color]="rune.color"
            [style.animation-delay]="rune.delay"
            [style.animation-duration]="rune.duration"
            [style.font-size]="rune.fontSize">
        {{ rune.symbol }}
      </span>
    }
  </div>

  <!-- 1. El cuerpo principal que crecerá para empujar el footer -->
  <main class="main-content">
    
    <!-- 2. La caja fuerte que mantendrá todo centrado de forma segura -->
    <div class="login-wrapper">

      <!-- La columna central flexible (Tu código original intacto) -->
      <section class="content-column">
        
        <!-- Avatar dinámico -->
        <div class="avatar-container">
          <div class="draco-avatar idle-animation"></div>
        </div>

        <!-- Título del juego -->
        <div class="title-container">
          <img src="assets/images/login/titulo.png" alt="Dragon Code" class="game-title">
        </div>

        <div class="form-container">
          
          <form class="login-form">
            <!-- Título -->
            <h2 class="form-title">INICIAR SESIÓN</h2>

            <!-- Grupo: Email -->
            <div class="input-group">
              <label for="email">Email</label>
              <input type="email" id="email" autocomplete="off" spellcheck="false">
            </div>

            <!-- Grupo: Contraseña -->
            <div class="input-group">
              <label for="password">Contraseña</label>
              <input type="password" id="password">
            </div>

            <!-- NUEVO: Botones de Acción -->
          <button type="submit" class="retro-btn primary-btn">
            INICIAR AVENTURA
          </button>
          
          <button type="button" class="retro-btn google-btn">
            <!-- Nota: Deberás tener un iconito de Google en esta ruta -->
            INICIAR CON GOOGLE
          </button>

            <!-- Enlaces de acción inferiores -->
            <div class="form-actions">
              <a href="#" class="retro-link">Crear Cuenta</a>
              <a href="#" class="retro-link">Recuperar Cuenta</a>
            </div>
          </form>

        </div>

      </section>

    </div>
  </main>

  <!-- 3. Tu nuevo Pie de Página Legal -->
  <footer class="legal-footer">
    <p>© 2026 DragonCode. Todos los derechos reservados.</p>
  </footer>

</div>
