<div class="shop-overlay" (click)="onClose()">
  <div class="shop-modal" (click)="$event.stopPropagation()">

    <header class="shop-header">
      <h2 class="shop-title">TIENDA DE AVATARES</h2>
      <div class="shop-header-actions">
        <div class="shop-stars-counter">
          <span class="star-icon">⭐</span>
          <span class="star-count">0 / 30</span>
        </div>
        <button type="button" class="shop-close-btn" (click)="onClose()">X</button>
      </div>
    </header>

    <p class="shop-subtitle">Selecciona tu companero de aventura</p>

    <div class="avatars-grid">
      @for (avatar of avatars; track avatar.id) {
        <button
          type="button"
          class="avatar-card"
          [class.is-selected]="avatarActual === avatar.path"
          (click)="selectAvatar(avatar)">
          <img [src]="avatar.path" [alt]="avatar.name" class="avatar-card-img">
          <div class="avatar-card-info">
            <span class="avatar-card-name">{{ avatar.name }}</span>
            <span class="avatar-card-price">{{ avatar.price }} ⭐</span>
            <p class="avatar-card-desc">{{ avatar.description }}</p>
          </div>
          @if (avatarActual === avatar.path) {
            <span class="avatar-active-badge">ACTIVO</span>
          }
        </button>
      }
    </div>

  </div>
</div>

<!-- MODAL CONFIRMACIÓN DE COMPRA -->
@if (isConfirmModalOpen && avatarToBuy) {
  <div class="shop-confirm-overlay" (click)="cancelPurchase()">
    <div class="shop-confirm-modal" (click)="$event.stopPropagation()">
      <h3 class="confirm-title">¿Desbloquear Avatar?</h3>
      <p class="confirm-text">¿Deseas gastar <span class="confirm-price">5 ⭐</span> en <strong>{{ avatarToBuy.name }}</strong>?</p>
      <div class="confirm-actions">
        <button class="btn-cancel" (click)="cancelPurchase()">Atrás</button>
        <button class="btn-confirm" (click)="confirmPurchase()">Confirmar</button>
      </div>
    </div>
  </div>
}
